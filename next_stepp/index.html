<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NextStepp - Plataforma de empleabilidad inteligente. Encuentra tu próximo empleo o al talento perfecto." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>NextStepp - Tu Próximo Paso Laboral</title>
  </head>
  <body>
    <div id="animated-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="holographic-overlay"></div>
    </div>
    <!-- SPLASH SCREEN OVERLAY -->
    <div id="splash-screen" class="splash-overlay">
      <div class="splash-bg-glow"></div>
      <div class="splash-content">
        <div class="ns-loader">
          <div class="loader-line line-1" title="Verde Camaleón Exótico"></div>
          <div class="loader-line line-2" title="Dorado Oro Brillante"></div>
          <div class="loader-core-pulse"></div>
        </div>
        <div class="splash-brand">
          <h1 class="splash-title">NEXT<span class="splash-title-accent">STEPP</span></h1>
          <div class="splash-status">
            <span class="splash-indicator"></span>
            <span class="splash-text" id="splashStatusText">Desbloqueando NextStepp...</span>
          </div>
          <div class="splash-progress">
            <div class="splash-progress-fill" id="splashProgressFill"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
